name: ML DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: DevSecOps Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-and-security:
    name: Code Quality, SAST & Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on

      - name: Linting with Ruff & Black
        run: |
          ruff check .
          black --check .

      - name: Strict Type Checking with Mypy
        run: |
          mypy preprocessing evaluation export monitoring datasets

      - name: SAST Security Scan with Bandit
        run: |
          bandit -r preprocessing training evaluation export monitoring datasets train_all.py -ll

      - name: Run Test Suite with Coverage Gate (>= 80%)
        run: |
          pytest tests/ --cov=preprocessing --cov=evaluation --cov=training --cov=export --cov=monitoring --cov=datasets --cov-fail-under=80 --cov-report=term-missing

  training-and-export:
    name: Model Catalog Training & Export Verification
    needs: quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Execute Full Model Training & Export Pipeline
        run: |
          python train_all.py

      - name: Validate Model Registry & Artifacts
        run: |
          python -c "import json; reg = json.load(open('model-registry/registry.json')); assert len(reg['models']) == 7, f'Expected 7 models, got {len(reg[\"models\"])}'"
