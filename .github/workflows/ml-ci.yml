name: ML DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-security:
    name: Code Quality, SAST & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linting with Ruff & Black
        run: |
          ruff check .
          black --check .

      - name: Type checking with Mypy
        run: |
          mypy . || true

      - name: SAST Security Scan with Bandit
        run: |
          bandit -r preprocessing training evaluation export monitoring -ll

      - name: Run Test Suite & Coverage
        run: |
          pytest tests/ --cov=preprocessing --cov=evaluation --cov=training --cov=export --cov=monitoring --cov-report=term-missing
